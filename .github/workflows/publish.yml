name: Publish

# Publishing uses PyPI's trusted publishing: the workflow is authorised by
# GitHub, so there is no API token to store anywhere. Add the workflow as a
# "pending publisher" on the project's PyPI page, and give this workflow
# the "pypi" environment below.
#
# The publish job only runs when a release is published, so the tag is the
# decision to publish.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Which package to publish"
        required: true
        default: nitpick-voice
        type: choice
        options:
          - nitpick-voice
          - nitpick-core

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ inputs.repository || 'nitpick-voice' }}/

    permissions:
      # Trusted publishing needs an OIDC token and a signed attestation.
      id-token: write
      attestations: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: python -m pip install --upgrade pip build twine

      - name: Work out which package to publish
        id: package
        shell: bash
        run: |
          if [ -n "${{ inputs.repository }}" ]; then
            echo "name=${{ inputs.repository }}" >> "$GITHUB_OUTPUT"
          elif [ -f "nitpick_core/__init__.py" ]; then
            echo "name=nitpick-core" >> "$GITHUB_OUTPUT"
          else
            echo "name=nitpick-voice" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the version has not been published already
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.package.outputs.name }}"
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "publishing $NAME $VERSION"
          if curl -fsS "https://pypi.org/pypi/$NAME/$VERSION/json" > /dev/null 2>&1; then
            echo "::error::$NAME $VERSION is already on PyPI — bump the version first"
            exit 1
          fi

      - name: Build
        run: |
          python -m build
          python -m twine check --strict dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
